<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 — 张家界国家森林公园</title>
<style>
:root {
  --pink: #e91e63; --pink-light: #fce4ec; --pink-dark: #c2185b;
  --bg: #fafafa; --card-bg: #fff; --text: #333; --text-light: #777;
  --border: #e0e0e0; --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --sidebar-w: 220px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

/* Login Screen */
.login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.login-card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 8px 40px rgba(233,30,99,0.15); width: 380px; text-align: center; }
.login-card h1 { font-size: 24px; margin-bottom: 8px; }
.login-card .sub { color: var(--text-light); font-size: 14px; margin-bottom: 24px; }
.login-card .cat { font-size: 48px; margin-bottom: 16px; }
.login-card input { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; font-size: 16px; margin-bottom: 16px; outline: none; transition: border-color 0.2s; }
.login-card input:focus { border-color: var(--pink); }
.login-card button { width: 100%; padding: 12px; background: var(--pink); color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
.login-card button:hover { background: var(--pink-dark); }
.login-error { color: #e53935; font-size: 13px; margin-top: 8px; display: none; }

/* Sidebar */
.sidebar { width: var(--sidebar-w); background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
.sidebar-brand { padding: 20px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.sidebar-brand .icon { font-size: 24px; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: var(--text); text-decoration: none; font-size: 14px; transition: all 0.15s; border-left: 3px solid transparent; }
.sidebar-nav a:hover { background: var(--pink-light); }
.sidebar-nav a.active { background: var(--pink-light); color: var(--pink); border-left-color: var(--pink); font-weight: 600; }
.sidebar-nav a .nav-icon { font-size: 18px; width: 24px; text-align: center; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-light); }

/* Main Content */
.main { margin-left: var(--sidebar-w); flex: 1; padding: 24px 32px; }
.main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.main-header h2 { font-size: 22px; }
.btn { padding: 8px 18px; border-radius: 6px; border: none; font-size: 14px; cursor: pointer; font-weight: 500; transition: all 0.15s; }
.btn-primary { background: var(--pink); color: #fff; }
.btn-primary:hover { background: var(--pink-dark); }
.btn-outline { background: #fff; color: var(--pink); border: 1.5px solid var(--pink); }
.btn-outline:hover { background: var(--pink-light); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-danger { background: #ef5350; color: #fff; }
.btn-danger:hover { background: #d32f2f; }
.btn-ghost { background: transparent; color: var(--pink); }
.btn-ghost:hover { background: var(--pink-light); }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
.stat-card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.stat-card .stat-num { font-size: 32px; font-weight: 700; color: var(--pink); }
.stat-card .stat-label { font-size: 13px; color: var(--text-light); margin-top: 4px; }

/* Data Table */
.table-wrapper { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.table-wrapper table { width: 100%; border-collapse: collapse; }
.table-wrapper th { background: var(--pink-light); color: var(--pink-dark); font-weight: 600; font-size: 13px; text-align: left; padding: 12px 16px; }
.table-wrapper td { padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
.table-wrapper tr:last-child td { border-bottom: none; }
.table-wrapper tr:hover td { background: #fafafa; }
.table-actions { display: flex; gap: 6px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 12px; padding: 28px; width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,0.15); }
.modal h3 { margin-bottom: 20px; font-size: 18px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 14px; font-family: inherit; outline: none; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--pink); }
.form-group textarea { min-height: 100px; resize: vertical; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* Toast */
.toast { position: fixed; top: 20px; right: 20px; background: #333; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 200; opacity: 0; transform: translateY(-10px); transition: all 0.3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: #4caf50; }
.toast.error { background: #ef5350; }

/* Gallery Grid (admin) */
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.gallery-item { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); position: relative; }
.gallery-item img { width: 100%; height: 140px; object-fit: cover; }
.gallery-item .gallery-info { padding: 10px; font-size: 12px; }
.gallery-item .gallery-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.gallery-item:hover .gallery-actions { opacity: 1; }
.gallery-item .gallery-actions button { background: rgba(255,255,255,0.9); border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; }

/* Hero Card Grid */
.hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.hero-card { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); position: relative; transition: transform 0.15s, box-shadow 0.15s; }
.hero-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.hero-card .hero-img-wrap { position: relative; width: 100%; height: 180px; background: #eee; overflow: hidden; }
.hero-card .hero-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
.hero-card .hero-img-wrap .hero-img-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 48px; color: #ccc; }
.hero-card .hero-body { padding: 14px 16px; }
.hero-card .hero-body .hero-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-card .hero-body .hero-subtitle { font-size: 12px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-card .hero-body .hero-idx { font-size: 11px; color: var(--pink); font-weight: 600; margin-bottom: 6px; }
.hero-card .hero-actions { display: flex; gap: 8px; padding: 0 16px 14px; }
.hero-card .hero-actions button { flex: 1; padding: 7px 0; border-radius: 6px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; }
.hero-card .hero-actions .btn-replace { color: var(--pink); border-color: var(--pink); }
.hero-card .hero-actions .btn-replace:hover { background: var(--pink-light); }
.hero-card .hero-actions .btn-delete { color: #ef5350; border-color: #ef5350; }
.hero-card .hero-actions .btn-delete:hover { background: #ffebee; }
.hero-card .hero-actions .btn-delete:disabled { color: #ccc; border-color: #ddd; cursor: not-allowed; background: #f5f5f5; }
.hero-card .hero-actions .btn-edit { color: #2196f3; border-color: #2196f3; }
.hero-card .hero-actions .btn-edit:hover { background: #e3f2fd; }
.hero-limit-hint { font-size: 12px; color: var(--text-light); margin-top: 8px; }
.hero-add-card { display: flex; align-items: center; justify-content: center; min-height: 340px; border: 2px dashed var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.15s; color: var(--text-light); font-size: 14px; flex-direction: column; gap: 8px; }
.hero-add-card:hover { border-color: var(--pink); color: var(--pink); background: var(--pink-light); }
.hero-add-card.disabled { cursor: not-allowed; opacity: 0.4; pointer-events: none; }
.hero-sync-bar { display: flex; justify-content: flex-end; margin-top: 16px; }

/* Settings area */
.settings-section { background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
.settings-section h3 { font-size: 16px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.token-hint { font-size: 12px; color: var(--text-light); margin-top: 6px; }

/* Content sections */
.content-section { display: none; }
.content-section.active { display: block; }

@media (max-width: 768px) {
  .sidebar { width: 60px; }
  .sidebar-brand span, .sidebar-nav a span:not(.nav-icon) { display: none; }
  .main { margin-left: 60px; padding: 16px; }
  .modal { width: 95%; }
}

  /* Image Upload */
  .img-upload-wrap { display:flex; gap:8px; align-items:center; }
  .img-upload-wrap input[type="text"] { flex:1; }
  .img-upload-btn { padding:6px 12px; background:var(--pink-light); color:var(--pink-dark); border:1.5px solid var(--pink); border-radius:6px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .img-upload-btn:hover { background:var(--pink); color:#fff; }
  .img-preview { margin-top:6px; }
  .img-preview img { max-width:120px; max-height:80px; border-radius:6px; object-fit:cover; border:1px solid var(--border); }
  .upload-progress { font-size:11px; color:var(--pink); margin-top:4px; }

  /* Upload Progress Bar */
  .upload-progress-bar-wrap { margin-top:8px; display:none; }
  .upload-progress-bar-wrap.active { display:block; }
  .upload-progress-bar-wrap .pb-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .upload-progress-bar-wrap .pb-label { font-size:12px; color:var(--text); font-weight:500; }
  .upload-progress-bar-wrap .pb-pct { font-size:12px; color:var(--pink); font-weight:600; }
  .upload-progress-bar-wrap .pb-stage { font-size:11px; color:var(--text-light); }
  .upload-progress-bar-wrap .pb-track { width:100%; height:6px; background:var(--pink-light); border-radius:3px; overflow:hidden; }
  .upload-progress-bar-wrap .pb-fill { height:100%; width:0%; background:linear-gradient(90deg, #f48fb1, var(--pink), var(--pink-dark)); border-radius:3px; transition: width 0.4s ease; }
  .upload-progress-bar-wrap.error .pb-fill { background:linear-gradient(90deg, #ef9a9a, #ef5350); }
  .upload-progress-bar-wrap.error .pb-pct { color:#ef5350; }
  .upload-progress-bar-wrap.error .pb-label { color:#ef5350; }

</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="cat">🐱</div>
    <h1>管理后台</h1>
    <div class="sub">张家界国家森林公园</div>
    <input type="password" id="loginPwd" placeholder="请输入管理密码" autofocus>
    <button onclick="doLogin()">登 录</button>
    <div class="login-error" id="loginError">密码错误，请重试</div>
  </div>
</div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar" style="display:none">
  <div class="sidebar-brand"><span class="icon">🐱</span><span>管理后台</span></div>
  <nav class="sidebar-nav">
    <a href="#" data-section="dashboard" class="active"><span class="nav-icon">📊</span><span>仪表盘</span></a>
    <a href="#" data-section="news"><span class="nav-icon">📰</span><span>新闻管理</span></a>
    <a href="#" data-section="scenic"><span class="nav-icon">🏔️</span><span>景区管理</span></a>
    <a href="#" data-section="experience"><span class="nav-icon">🎯</span><span>体验管理</span></a>
    <a href="#" data-section="gallery"><span class="nav-icon">🖼️</span><span>图库管理</span></a>
    <a href="#" data-section="hero"><span class="nav-icon">🎬</span><span>Hero 管理</span></a>
    <a href="#" data-section="settings"><span class="nav-icon">⚙️</span><span>设置</span></a>
  </nav>
  <div class="sidebar-footer">v1.0 · visitzhangjiajie.com</div>
</aside>

<!-- Main Content -->
<div class="main" id="mainContent" style="display:none">
  <div class="main-header">
    <h2 id="pageTitle">仪表盘</h2>
    <button class="btn btn-outline btn-sm" onclick="doLogout()">退出登录</button>
  </div>

  <!-- Dashboard -->
  <div class="content-section active" id="sec-dashboard">
    <div class="stats-grid" id="dashboardStats"></div>
  </div>

  <!-- News -->
  <div class="content-section" id="sec-news">
    <div class="main-header" style="margin-bottom:16px"><h2>新闻管理</h2><button class="btn btn-primary" onclick="openNewsModal()">+ 新增新闻</button></div>
    <div class="table-wrapper"><table><thead><tr><th>日期</th><th>标签</th><th>标题</th><th>图片</th><th>操作</th></tr></thead><tbody id="newsTableBody"></tbody></table></div>
  </div>

  <!-- Scenic -->
  <div class="content-section" id="sec-scenic">
    <div class="main-header" style="margin-bottom:16px"><h2>景区管理</h2><button class="btn btn-primary" onclick="openScenicModal()">+ 新增景区</button></div>
    <div class="table-wrapper"><table><thead><tr><th>ID</th><th>名称</th><th>标签</th><th>图片</th><th>大图</th><th>操作</th></tr></thead><tbody id="scenicTableBody"></tbody></table></div>
  </div>

  <!-- Experience -->
  <div class="content-section" id="sec-experience">
    <div class="main-header" style="margin-bottom:16px"><h2>体验管理</h2><button class="btn btn-primary" onclick="openExpModal()">+ 新增体验</button></div>
    <div class="table-wrapper"><table><thead><tr><th>ID</th><th>标题</th><th>描述</th><th>图片</th><th>操作</th></tr></thead><tbody id="expTableBody"></tbody></table></div>
  </div>

  <!-- Gallery -->
  <div class="content-section" id="sec-gallery">
    <div class="main-header" style="margin-bottom:16px"><h2>图库管理</h2><button class="btn btn-primary" onclick="openGalleryModal()">+ 新增图片</button></div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <!-- Hero -->
  <div class="content-section" id="sec-hero">
    <div class="main-header" style="margin-bottom:16px"><h2>Hero 轮播管理</h2><span class="hero-limit-hint" id="heroLimitHint"></span></div>
    <div class="hero-grid" id="heroGrid"></div>
    <div class="hero-sync-bar"><button class="btn btn-primary" onclick="saveHeroToGitHub()">💾 同步 Hero 到 GitHub</button></div>
  </div>

  <!-- Settings -->
  <div class="content-section" id="sec-settings">
    <div class="settings-section">
      <h3>⚙️ GitHub 配置</h3>
      <div class="form-group">
        <label>Fine-Grained Token <span style="color:#e91e63;font-size:12px">(建议)</span></label>
        <input type="password" id="ghToken" placeholder="github_pat_xxxxxxxxxxxx">
        <div class="token-hint">
          建议用 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" style="color:#2196f3">Fine-grained token</a>：
          仅授权当前仓库，权限选 <b>Contents: Read and write</b>。即使泄露也只影响这一个仓库。
        </div>
      </div>
      <div class="form-group">
        <label>仓库名</label>
        <input type="text" id="ghRepo" value="WillyYe/visitzhangjiajie.com" placeholder="用户名/仓库名">
      </div>
      <button class="btn btn-primary" onclick="saveGitHubConfig()">保存配置</button>
      <button class="btn btn-outline" onclick="testGitHubConnection()" style="margin-left:8px">测试连接</button>
      <div id="ghConfigStatus" style="margin-top:12px;font-size:13px"></div>
    </div>
    <div class="settings-section">
      <h3>🔒 修改管理密码</h3>
      <div class="form-group"><label>新密码</label><input type="password" id="newPwd" placeholder="输入新密码"></div>
      <button class="btn btn-primary" onclick="changePassword()">修改密码</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ==================== CONFIG ====================
var ADMIN_PWD = 'zhangjiajie2026';
var AUTH_KEY = 'zjj_admin_auth';
var GH_REPO = localStorage.getItem('gh_repo') || 'WillyYe/visitzhangjiajie.com';
var GH_BRANCH = 'main';

function getGhToken() { return localStorage.getItem('gh_token'); }

// 直接调用 GitHub API（CORS 已支持），建议使用 Fine-Grained Token（仅限当前仓库权限）
function ghFetch(path, method, body) {
  var token = getGhToken();
  if (!token) { return Promise.reject(new Error('GitHub Token 未配置，请在「设置」中配置')); }
  var url = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + path;
  if (!method || method === 'GET') url += '?ref=' + GH_BRANCH;
  var opts = {
    method: method || 'GET',
    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' }
  };
  if (body) {
    var payload = { message: body.message, content: body.content, branch: GH_BRANCH };
    if (body.sha) payload.sha = body.sha;
    opts.body = JSON.stringify(payload);
  }
  return fetch(url, opts);
}

// ==================== AUTH ====================

function doLogin() {
  var pwd = document.getElementById('loginPwd').value;
  if (pwd === ADMIN_PWD) {
    localStorage.setItem(AUTH_KEY, '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('sidebar').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'block';
    initApp();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem(AUTH_KEY);
  location.reload();
}

// Auto-login
if (localStorage.getItem(AUTH_KEY) === '1') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('sidebar').style.display = 'flex';
  document.getElementById('mainContent').style.display = 'block';
}

// ==================== DATA ====================
var DATA_BASE = '../data/';
var newsData = [], scenicData = [], expData = [], galleryData = [], heroData = {slides:[]};

function loadAllData() {
  return Promise.all([
    fetch(DATA_BASE + 'news.json').then(function(r){return r.json()}).then(function(d){newsData=d}),
    fetch(DATA_BASE + 'scenic.json').then(function(r){return r.json()}).then(function(d){scenicData=d}),
    fetch(DATA_BASE + 'experience.json').then(function(r){return r.json()}).then(function(d){expData=d}),
    fetch(DATA_BASE + 'gallery.json').then(function(r){return r.json()}).then(function(d){galleryData=d}),
    fetch(DATA_BASE + 'hero.json').then(function(r){return r.json()}).then(function(d){heroData=d})
  ]);
}

// ==================== NAVIGATION ====================
document.querySelectorAll('.sidebar-nav a').forEach(function(a) {
  a.addEventListener('click', function(e) {
    e.preventDefault();
    document.querySelectorAll('.sidebar-nav a').forEach(function(x){x.classList.remove('active')});
    this.classList.add('active');
    var section = this.dataset.section;
    document.querySelectorAll('.content-section').forEach(function(s){s.classList.remove('active')});
    document.getElementById('sec-' + section).classList.add('active');
    document.getElementById('pageTitle').textContent = this.textContent.trim();
  });
});

// ==================== TOAST ====================
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + (type||'') + ' show';
  setTimeout(function(){t.classList.remove('show')}, 2500);
}

// ==================== RENDER FUNCTIONS ====================
function renderDashboard() {
  document.getElementById('dashboardStats').innerHTML =
    '<div class="stat-card"><div class="stat-num">'+newsData.length+'</div><div class="stat-label">新闻</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+scenicData.length+'</div><div class="stat-label">景区</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+expData.length+'</div><div class="stat-label">体验</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+galleryData.length+'</div><div class="stat-label">图库</div></div>'+
    '<div class="stat-card"><div class="stat-num">'+heroData.slides.length+'</div><div class="stat-label">Hero Slide</div></div>';
}

function renderNews() {
  var h = '';
  newsData.forEach(function(n,i){
    h += '<tr><td>'+n.date.day+' '+n.date.month+' '+n.date.year+'</td><td><span style="background:#fce4ec;color:#c2185b;padding:2px 8px;border-radius:10px;font-size:11px">'+n.tag+'</span></td><td>'+esc(n.titleEn)+'</td><td>'+esc(n.img)+'</td><td class="table-actions"><button class="btn btn-outline btn-sm" onclick="openNewsModal('+i+')">编辑</button><button class="btn btn-danger btn-sm" onclick="deleteNews('+i+')">删除</button></td></tr>';
  });

// ==================== HERO IMAGE REPLACE ====================
function replaceHeroImage(idx) {
  var fi = document.getElementById('fileInput');
  pendingUploads._targetInput = null; // direct replace, no modal input
  fi.onchange = function() {
    var file = fi.files[0];
    if (!file) return;
    showToast('🖼 压缩图片中...', '');
    compressImage(file, 1920, 0.85, function(base64, compressedSize) {
      var newSize = (compressedSize / 1024 / 1024).toFixed(1);
      showToast('⏳ 压缩后 ' + newSize + 'MB，上传中...', '');
      var cleanName = file.name.replace(/[\\/*?:"<>|]/g, '_');
      var path = 'assets/images/' + cleanName;
      directHeroUpload(path, base64, file.name, idx);
    });
  };
  fi.value = '';
  fi.click();
}

function directHeroUpload(path, base64Content, fileName, idx) {
  showToast('🔍 检查仓库中...', '');

  ghFetch(path, 'GET').then(function(r){ return r.ok ? r.json() : null; })
  .then(function(fileInfo) {
    showToast('📤 正在上传 ' + fileName + ' ...', '');
    return ghFetch(path, 'PUT', {
      content: base64Content,
      message: 'Replace hero image: ' + fileName,
      sha: fileInfo && fileInfo.sha ? fileInfo.sha : null
    });
  }).then(function(r){
    if (!r.ok) return r.json().then(function(d){ throw new Error(d.message); });
    heroData.slides[idx].img = path;
    renderHero();
    showToast('✅ 图片已替换，正在同步 Hero 数据...', 'success');
    saveHeroToGitHub();
  }).catch(function(err){
    var msg = friendlyError(err.message || '');
    showToast('❌ 替换失败：' + msg, 'error');
  });
}

// ==================== IMAGE COMPRESS ====================
function compressImage(file, maxW, quality, callback) {
  var img = new Image();
  var url = URL.createObjectURL(file);
  img.onload = function() {
    URL.revokeObjectURL(url);
    var w = img.width, h = img.height;
    if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    canvas.toBlob(function(blob) {
      var reader = new FileReader();
      reader.onload = function(e) {
        callback(e.target.result.split(',')[1], blob.size);
      };
      reader.readAsDataURL(blob);
    }, 'image/jpeg', quality);
  };
  img.src = url;
}

// ==================== PROGRESS BAR ====================
function showProgressBar(inputId) {
  var previewDiv = document.getElementById('prev_' + inputId);
  previewDiv.innerHTML = ''+
    '<div class="upload-progress-bar-wrap active" id="pb_'+inputId+'">'+
      '<div class="pb-info">'+
        '<span class="pb-label">准备上传</span>'+
        '<span class="pb-pct">0%</span>'+
      '</div>'+
      '<div class="pb-track"><div class="pb-fill" id="pbfill_'+inputId+'"></div></div>'+
      '<div class="pb-stage">等待开始...</div>'+
    '</div>';
}

function updateProgressBar(inputId, pct, label, stage) {
  var wrap = document.getElementById('pb_'+inputId);
  var fill = document.getElementById('pbfill_'+inputId);
  if (!wrap || !fill) return;
  var labelEl = wrap.querySelector('.pb-label');
  var pctEl = wrap.querySelector('.pb-pct');
  var stageEl = wrap.querySelector('.pb-stage');
  fill.style.width = pct + '%';
  pctEl.textContent = Math.round(pct) + '%';
  if (label) labelEl.textContent = label;
  if (stage) stageEl.textContent = stage;
}

function markProgressError(inputId, label, stage) {
  var wrap = document.getElementById('pb_'+inputId);
  var fill = document.getElementById('pbfill_'+inputId);
  if (!wrap || !fill) return;
  wrap.classList.add('error');
  var labelEl = wrap.querySelector('.pb-label');
  var pctEl = wrap.querySelector('.pb-pct');
  var stageEl = wrap.querySelector('.pb-stage');
  labelEl.textContent = label || '上传失败';
  pctEl.textContent = '✕';
  fill.style.width = '100%';
  if (stage) stageEl.textContent = stage;
}

function animateProgress(inputId, from, to, duration, label, stage, callback) {
  updateProgressBar(inputId, from, label, stage);
  var start = Date.now();
  function tick() {
    var elapsed = Date.now() - start;
    var pct = from + (to - from) * Math.min(elapsed / duration, 1);
    updateProgressBar(inputId, pct, label, stage);
    if (elapsed < duration) {
      requestAnimationFrame(tick);
    } else {
      if (callback) callback();
    }
  }
  requestAnimationFrame(tick);
}

// ==================== IMAGE UPLOAD ====================
var pendingUploads = {};
function triggerUpload(inputId) {
  var fi = document.getElementById('fileInput');
  pendingUploads._targetInput = inputId;
  fi.onchange = function() {
    var file = fi.files[0];
    if (!file) return;
    var origSize = (file.size / 1024 / 1024).toFixed(1);
    showProgressBar(inputId);
    animateProgress(inputId, 0, 15, 400, '图片压缩中', '原始 ' + origSize + 'MB → 压缩中...', function(){
      compressImage(file, 1920, 0.85, function(base64, compressedSize) {
        var newSize = (compressedSize / 1024 / 1024).toFixed(1);
        animateProgress(inputId, 15, 30, 200, '压缩完成', origSize + 'MB → ' + newSize + 'MB (压缩 ' + Math.round((1 - compressedSize/file.size)*100) + '%)', function(){
          var cleanName = file.name.replace(/[\\/*?:"<>|]/g, '_');
          var path = 'assets/images/' + cleanName;
          uploadToGitHub(path, base64, file.name, inputId);
        });
      });
    });
  };
  fi.value = '';
  fi.click();
}

function friendlyError(errMsg) {
  var msg = errMsg || '';
  if (msg.indexOf('Bad credentials') !== -1 || msg.indexOf('401') !== -1) return 'GitHub 授权失败，Token 可能已过期，请联系管理员更新';
  if (msg.indexOf('Not Found') !== -1 || msg.indexOf('404') !== -1) return '文件路径不存在，请检查仓库配置';
  if (msg.indexOf('too large') !== -1 || msg.indexOf('too long') !== -1 || msg.indexOf('413') !== -1) return '图片体积过大，请换一张小一点的图片';
  if (msg.indexOf('NetworkError') !== -1 || msg.indexOf('Failed to fetch') !== -1) return '网络连接失败，请检查网络后重试';
  if (msg.indexOf('timeout') !== -1) return '上传超时，请重试';
  if (msg.indexOf('CORS') !== -1) return '跨域请求被拦截，请检查服务端配置';
  return msg || '未知错误，请重试或联系管理员';
}

function uploadToGitHub(path, base64Content, fileName, inputId) {
  var previewDiv = document.getElementById('prev_' + inputId);

  animateProgress(inputId, 30, 40, 300, '检查仓库', '查询 ' + path + ' ...');

  ghFetch(path, 'GET').then(function(r){ return r.ok ? r.json() : null; })
  .then(function(fileInfo){
    animateProgress(inputId, 40, 60, 200, '正在上传', '通过 GitHub API 上传中...');
    return ghFetch(path, 'PUT', {
      content: base64Content,
      message: 'Upload image: ' + fileName,
      sha: fileInfo && fileInfo.sha ? fileInfo.sha : null
    });
  }).then(function(r){
    if (!r.ok) return r.json().then(function(d){ throw new Error(d.message); });
    animateProgress(inputId, 60, 100, 300, '上传成功', '图片已写入 GitHub 仓库', function(){
      document.getElementById(inputId).value = path;
      previewDiv.innerHTML = '<img src="../' + path + '?t=' + Date.now() + '" alt="preview">';
      showToast('图片上传成功 ✅', 'success');
    });
  }).catch(function(err){
    var msg = friendlyError(err.message || '');
    markProgressError(inputId, '上传失败', msg);
    showToast('❌ 上传失败：' + msg, 'error');
  });
}

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

// ==================== SETTINGS ====================
function saveGitHubConfig() {
  var token = document.getElementById('ghToken').value.trim();
  var repo = document.getElementById('ghRepo').value.trim();
  if (!token) { showToast('请输入 GitHub Token','error'); return; }
  if (!repo || repo.indexOf('/') === -1) { showToast('仓库名格式错误，应为：用户名/仓库名','error'); return; }
  localStorage.setItem('gh_token', token);
  localStorage.setItem('gh_repo', repo);
  GH_REPO = repo;
  showToast('GitHub 配置已保存 ✅','success');
  renderGhStatus();
}
function testGitHubConnection() {
  var token = getGhToken();
  if (!token) { showToast('请先保存 GitHub Token','error'); return; }
  showToast('正在测试连接...','');
  fetch('https://api.github.com/user', { headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' } })
    .then(function(r){ if (r.ok) return r.json(); throw new Error('Token 验证失败: HTTP ' + r.status); })
    .then(function(d){ showToast('连接成功！用户: ' + d.login + ' ✅','success'); })
    .catch(function(err){ showToast('连接失败: ' + err.message,'error'); });
}
function renderGhStatus() {
  var el = document.getElementById('ghConfigStatus');
  var token = getGhToken();
  if (!token) { el.innerHTML = '<span style="color:#e53935">⚠️ GitHub Token 未配置，无法同步到 GitHub</span>'; return; }
  el.innerHTML = '<span style="color:#43a047">✅ 已配置 Token，仓库: ' + esc(GH_REPO) + '</span>';
}
function changePassword() {
  var np = document.getElementById('newPwd').value;
  if (!np) { showToast('请输入新密码','error'); return; }
  ADMIN_PWD = np;
  showToast('密码已修改 ✅ 请牢记新密码','success');
}

// ==================== INIT ====================
var appInitialized = false;
function initApp() {
  if (appInitialized) return;
  appInitialized = true;

  // Load saved GitHub config into inputs
  var savedToken = localStorage.getItem('gh_token');
  var savedRepo = localStorage.getItem('gh_repo');
  if (savedToken) document.getElementById('ghToken').value = savedToken;
  if (savedRepo) document.getElementById('ghRepo').value = savedRepo;
  renderGhStatus();

  loadAllData().then(function() {
    renderDashboard();
    renderNews();
    renderScenic();
    renderExp();
    renderGallery();
    renderHero();
  }).catch(function(err) {
    showToast('数据加载失败: ' + err.message, 'error');
  });

  // Add global save button
  var header = document.querySelector('.main-header');
  var saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary btn-sm';
  saveBtn.textContent = '💾 保存到 GitHub';
  saveBtn.style.marginLeft = '12px';
  saveBtn.onclick = saveAllToGitHub;
  header.appendChild(saveBtn);
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Init on load if already authed
if (localStorage.getItem(AUTH_KEY) === '1') initApp();
</script>
