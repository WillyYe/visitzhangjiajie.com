<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在跳转百度 OAuth…</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f5f5f5; color:#333; }
  .box { text-align:center; }
  .spinner { width:32px; height:32px; border:3px solid #ddd; border-top-color:#3b6bf4; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p>正在跳转至百度OAuth授权页面…</p>
</div>
<script>
  // 从 URL 参数获取目标地址，自动跳转（无 Referer，因 meta no-referrer）
  var params = new URLSearchParams(location.search);
  var target = params.get('url');
  if (target) {
    // 用 location.replace 跳转，配合 meta no-referrer，百度看不到来源
    window.location.replace(target);
  } else {
    document.querySelector('p').textContent = '缺少跳转参数，请从管理员设置页面重新操作。';
  }
</script>
</body>
</html>
