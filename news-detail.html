<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">News Detail | Zhangjiajie National Forest Park</title>
  <meta name="description" id="metaDesc" content="Latest news from Zhangjiajie National Forest Park." />
  <meta name="theme-color" content="#1a4a30" />

  <!-- Preconnect for Fonts -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    /* ========== RESET & BASE ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
      color: #1a1a1a;
      background: #fff;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { text-decoration: none; color: inherit; }
    img { display: block; max-width: 100%; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ========== COLOR VARIABLES ========== */
    :root {
      --green-dark: #0d2b1e;
      --green-mid: #1a4a30;
      --green-light: #2d6a4f;
      --green-accent: #52b788;
      --gold: #b5882a;
      --gold-light: #d4a843;
      --cream: #f7f3ee;
      --cream-dark: #e8e4de;
      --text-dark: #1a1a1a;
      --text-mid: #4a4a4a;
      --text-light: #888;
      --white: #fff;
    }

    /* ========== HEADER ========== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--green-dark);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--white);
    }
    .header-logo-icon {
      width: 40px;
      height: 40px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .header-logo-text {
      font-family: 'Noto Serif SC', serif;
      font-size: 14px;
      font-weight: 600;
    }
    .lang-switch {
      display: flex;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
    }
    .lang-switch button {
      padding: 6px 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      transition: background 0.2s, color 0.2s;
    }
    .lang-switch button.active {
      background: var(--gold);
      color: var(--white);
    }

    /* ========== HERO ========== */
    .hero {
      height: 50vh;
      min-height: 320px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      text-align: center;
      margin-top: 64px;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.6));
    }
    .hero-content {
      position: relative;
      z-index: 10;
      padding: 0 24px;
      max-width: 800px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .hero-title {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 700;
      margin-bottom: 12px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
      line-height: 1.3;
    }
    .hero-date {
      font-size: 14px;
      opacity: 0.85;
      letter-spacing: 1px;
    }

    /* ========== CONTENT ========== */
    .content-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green-mid);
      font-size: 14px;
      margin-bottom: 32px;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--green-dark);
    }

    /* ========== NEWS META ========== */
    .news-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .news-tag {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .news-tag.overview { background: #e8f5e9; color: #2e7d32; }
    .news-tag.honor    { background: #fff8e1; color: #f57f17; }
    .news-tag.geo      { background: #e3f2fd; color: #1565c0; }
    .news-tag.eco      { background: #f3e5f5; color: #6a1b9a; }
    .news-tag.avatar   { background: #e0f7fa; color: #00838f; }
    .news-date-text {
      font-size: 13px;
      color: var(--text-light);
    }

    /* ========== NEWS BODY ========== */
    .news-body {
      font-size: 16px;
      line-height: 1.9;
      color: var(--text-mid);
    }
    .news-body p {
      margin-bottom: 20px;
    }
    .news-body p:last-child {
      margin-bottom: 0;
    }
    .news-body strong {
      color: var(--green-dark);
      font-weight: 600;
    }

    /* ========== NEWS IMAGE ========== */
    .news-featured-img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 32px;
    }

    /* ========== RELATED NEWS ========== */
    .related-section {
      margin-top: 64px;
      padding-top: 48px;
      border-top: 1px solid var(--cream-dark);
    }
    .related-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--green-dark);
      margin-bottom: 24px;
    }
    .related-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .related-card {
      border-radius: 14px;
      overflow: hidden;
      background: var(--white);
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: transform 0.25s, box-shadow 0.25s;
      cursor: pointer;
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .related-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.12);
    }
    .related-img {
      height: 140px;
      background-size: cover;
      background-position: center;
    }
    .related-body {
      padding: 14px 16px 18px;
    }
    .related-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 6px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .related-card-date {
      font-size: 12px;
      color: var(--text-light);
    }

    /* ========== FOOTER ========== */
    .footer {
      padding: 40px 24px;
      text-align: center;
      background: var(--cream);
      font-size: 13px;
      color: var(--text-light);
    }
    .footer a {
      color: var(--green-mid);
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .related-grid { grid-template-columns: 1fr; }
      .news-featured-img { height: 200px; }
      .hero { height: 40vh; min-height: 260px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="header-logo">
      <div class="header-logo-icon">🏔️</div>
      <div class="header-logo-text">Zhangjiajie Park</div>
    </a>
  </header>

  <!-- HERO -->
  <section class="hero" id="heroSection">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-badge" id="heroBadge"></div>
      <h1 class="hero-title" id="heroTitle"></h1>
      <p class="hero-date" id="heroDate"></p>
    </div>
  </section>

  <!-- CONTENT -->
  <section class="content-section">
    <a href="index.html#news" class="back-link">
      <span>←</span>
      <span>Back to News</span>
    </a>

    <!-- News Meta -->
    <div class="news-meta" id="newsMeta">
      <span class="news-tag" id="newsTag"></span>
      <span class="news-date-text" id="newsDateText"></span>
    </div>

    <!-- Featured Image -->
    <img class="news-featured-img" id="newsFeaturedImg" src="" alt="" />

    <!-- News Body -->
    <div class="news-body" id="newsBody"></div>

    <!-- Related News -->
    <div class="related-section">
      <h3 class="related-title">Related News</h3>
      <div class="related-grid" id="relatedGrid"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2024 Zhangjiajie National Forest Park · World Natural Heritage</p>
  </footer>

  <script defer>
    // ========== NEWS DATA ==========
    var newsData = [];

    function loadNewsData() {
      return fetch('data/news.json?t=' + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(d) { newsData = d; });
    }

    // ========== GET NEWS INDEX FROM URL ==========
    function getNewsIndex() {
      var params = new URLSearchParams(window.location.search);
      var id = parseInt(params.get('id'), 10);
      if (newsData.length === 0) return -1;
      if (isNaN(id) || id < 0 || id >= newsData.length) return 0;
      return id;
    }

    function getCurrentNews() {
      var index = getNewsIndex();
      if (index === -1 || !newsData[index]) return { data: null, index: -1 };
      return { data: newsData[index], index: index };
    }

    // ========== RENDER NEWS DETAIL ==========
    function renderNewsDetail() {
      var news = getCurrentNews().data;
      if (!news) {
        document.getElementById('heroBg').style.background = '#1a4a30';
        document.getElementById('heroBadge').textContent = 'NEWS';
        document.getElementById('heroTitle').textContent = 'No news available';
        document.getElementById('heroDate').textContent = '';
        document.getElementById('newsTag').textContent = '';
        document.getElementById('newsDateText').textContent = '';
        document.getElementById('newsFeaturedImg').style.display = 'none';
        document.getElementById('newsBody').innerHTML = '<p style="color:#888;text-align:center;padding:40px 0">暂无新闻数据</p>';
        document.title = 'News | Zhangjiajie National Forest Park';
        return;
      }
      document.getElementById('heroBg').style.backgroundImage = 'url(\'' + news.img + '?v=2\')';
      document.getElementById('heroBadge').textContent = news.tag.toUpperCase();
      document.getElementById('heroTitle').textContent = news.titleEn;

      var dateStr = news.date.day + ' ' + news.date.month + ' ' + news.date.year;
      document.getElementById('heroDate').textContent = dateStr;

      var tagEl = document.getElementById('newsTag');
      tagEl.textContent = news.tag.toUpperCase();
      tagEl.className = 'news-tag ' + news.tag;

      document.getElementById('newsDateText').textContent = dateStr;

      var imgEl = document.getElementById('newsFeaturedImg');
      imgEl.src = news.img + '?v=2';
      imgEl.alt = news.titleEn;

      document.getElementById('newsBody').innerHTML = news.contentEn || news.descEn;
      document.title = news.titleEn + ' | Zhangjiajie National Forest Park';
    }

    // ========== RENDER RELATED NEWS ==========
    function renderRelatedNews() {
      var current = getCurrentNews();
      var currentIndex = current.index;
      var container = document.getElementById('relatedGrid');
      var html = '';
      var count = 0;

      for (var i = 0; i < newsData.length && count < 3; i++) {
        if (i === currentIndex) continue;
        var item = newsData[i];
        html += '<a href="news-detail.html?id=' + i + '" class="related-card">';
        html += '<div class="related-img" style="background-image: url(\'' + item.img + '?v=2\')"></div>';
        html += '<div class="related-body">';
        html += '<h4 class="related-card-title">' + item.titleEn + '</h4>';
        html += '<p class="related-card-date">' + item.date.day + ' ' + item.date.month + ' ' + item.date.year + '</p>';
        html += '</div></a>';
        count++;
      }

      container.innerHTML = html;
    }

    // ========== INITIALIZE ==========
    document.addEventListener('DOMContentLoaded', function() {
      loadNewsData().then(function() {
        renderNewsDetail();
        renderRelatedNews();
      }).catch(function(err) {
        console.error('Failed to load news:', err);
        renderNewsDetail();
        renderRelatedNews();
      });
    });
  </script>
</body>
</html>
